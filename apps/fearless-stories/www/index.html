<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b12"><title>Fearless Stories</title>
<style>
:root{color-scheme:dark;--text:#f6f3fa;--muted:#aaa9c0;--border:#303044;--accent:#c0a0ff}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080b12;color:var(--text);font:14px system-ui,-apple-system,Arial}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:600px;margin:0 auto;padding:15px 17px 110px;min-height:80vh}header{position:sticky;top:0;z-index:3;height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #27283a;padding:0 17px;background:#080b12ee}header strong{font-size:13px;letter-spacing:.055em}header strong span{color:#a9a3c6}.brand{background:#ad89fc;color:#140d1f;border-radius:9px;padding:9px;font-size:18px;font-weight:900;margin-right:8px}header button{background:#1b1d2b;color:white;border:1px solid var(--border);border-radius:12px;padding:10px 13px}
.eyebrow{color:#c9b0fb;text-transform:uppercase;font-size:10px;letter-spacing:.19em;font-weight:800}.hero{margin-top:14px;padding:30px 22px;border:1px solid #4b365e;border-radius:22px;min-height:265px;background:radial-gradient(ellipse at 90% 0%,#744da888,transparent 65%),linear-gradient(120deg,#241a35,#111420)}h1{font-size:35px;letter-spacing:-.065em;line-height:1.12;margin:22px 0 12px}h1 em{font-style:normal;color:#d1b4ff}p{color:var(--muted);line-height:1.65;font-size:13px}h2{font-size:17px;margin:29px 0 14px}.btn{min-height:43px;border:0;border-radius:11px;padding:0 16px;background:#c3a6ff;color:#161120;font-weight:750}.btn.alt{background:#342c44;color:#eee4ff}.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:20px}.box{border-radius:15px;border:1px solid var(--border);background:linear-gradient(125deg,#1d1c29,#11151e);padding:22px;margin:12px 0}.box b{display:block;font-size:15px}.box p{margin:8px 0 0;font-size:12px}.genres{display:grid;grid-template-columns:1fr 1fr;gap:10px}.genre{display:flex;justify-content:space-between;background:#292338;border:1px solid #423354;border-radius:13px;padding:19px 12px;text-align:left;color:#fff}.genre:nth-child(2){background:#2a1e2b}.genre:nth-child(3){background:#1b2d32}.genre:nth-child(4){background:#2b282a}.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0}.chip{background:#191c27;border:1px solid #373446;border-radius:30px;padding:9px 12px;color:#bbb4cb;white-space:nowrap}.chip.selected{background:#38294e;border-color:#b293f6;color:#eddfff}.search,.input{width:100%;background:#171b27;border:1px solid #3f4255;color:#fff;border-radius:13px;padding:15px 12px;margin:12px 0}.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.plan{text-align:center;background:#211b2e;border:1px solid #443556;border-radius:13px;padding:17px 4px}.plan b{font-size:24px;display:block}.plan small{color:#a6a2b9}.notice{border-radius:13px;background:#1c2534;border:1px solid #3a4a65;color:#ccd8f2;padding:14px;font-size:12px;line-height:1.65}.small{font-size:11px;color:#858a9b}.nav{position:fixed;bottom:0;left:0;right:0;background:#11141cf5;z-index:4;border-top:1px solid #272839;padding-bottom:env(safe-area-inset-bottom)}.tabs{display:grid;grid-template-columns:repeat(4,1fr);max-width:600px;margin:auto;height:70px}.tab{border:0;background:none;color:#9597aa;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px}.tab span{font-size:22px}.tab.selected{color:#cfb4ff}label{display:block;margin-top:17px}.toggle{accent-color:#b294ff}.item{padding:16px 0;border-bottom:1px solid var(--border)}a{color:#ccb4ff}
</style></head>
<body><header><div><span class="brand">F.</span><strong>FEARLESS <span>STORIES</span></strong></div><button id="settings" aria-label="Settings">⚙</button></header><main id="content"></main><nav class="nav"><div class="tabs"><button class="tab selected" data-tab="home"><span>⌂</span>Home</button><button class="tab" data-tab="discover"><span>⌕</span>Discover</button><button class="tab" data-tab="saved"><span>♡</span>Saved</button><button class="tab" data-tab="profile"><span>◯</span>Profile</button></div></nav>
<script>
(function(){'use strict';const content=document.getElementById('content');let current='home',genre='All',query='';const key='fearless.ott.v4.';function get(k){try{return localStorage.getItem(key+k)||''}catch{return ''}}function put(k,v){try{localStorage.setItem(key+k,String(v))}catch{}}function escape(v){return String(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]))}function empty(title,msg){return '<div class="box"><b>'+title+'</b><p>'+msg+'</p></div>'}
const pages={
home:function(){return '<div class="eyebrow" style="margin:13px 0">YOUR ORIGINAL DRAMA UNIVERSE</div><div class="hero"><div class="eyebrow">FEARLESS ORIGINALS</div><h1>Big stories.<br><em>Short episodes.</em></h1><p>Original cinematic dramas. Zero frustrating ads.</p><div class="row"><button class="btn" data-go="discover">Explore stories ↗</button><button class="btn alt" data-go="profile">Plans</button></div></div><h2>New & Trending <span class="small">0 LIVE</span></h2>'+empty('Originals coming soon','No stories are published yet. Only admin-approved episodes will be visible here.')+'<h2>Explore genres</h2><div class="genres">'+['Drama','Thriller','Romance','Horror'].map(g=>'<button class="genre" data-genre="'+g+'">'+g+' ↗</button>').join('')+'</div><p class="small">No forced ads. Small sponsored cards only after admin approval.</p>'},
discover:function(){return '<div class="eyebrow">DISCOVER</div><h1>Find your next obsession.</h1><p>Browse approved short dramas.</p><input class="search" id="search" type="search" placeholder="Search dramas..." maxlength="80" value="'+escape(query)+'"><div class="chips">'+['All','Drama','Thriller','Romance','Horror','Mystery'].map(g=>'<button data-filter="'+g+'" class="chip '+(g===genre?'selected':'')+'">'+g+'</button>').join('')+'</div><p class="small" id="result">0 results</p>'+empty('No stories published yet','Search and genre filtering are ready. Connect a backend to show real episodes.')},
saved:function(){return '<div class="eyebrow">WATCHLIST</div><h1>Your watchlist.</h1><p>Save your favourite short dramas here.</p>'+empty('Your list is empty','Sign in to a connected server to save real series.')+'<h2>Continue watching</h2>'+empty('Nothing watched yet','Progress will appear when real episodes are available.')},
profile:function(){return '<div class="eyebrow">ACCOUNT</div><h1>All your stories.</h1><p>Profile, premium access and history.</p>'+empty('Viewer account',get('server')?'A server address has been saved in Settings.':'Accounts require a connected backend.')+'<div class="row"><button class="btn" data-go="settings">Server settings ↗</button></div><h2>Low-cost plans</h2><div class="plans"><div class="plan"><b>₹9</b><small>7 days</small></div><div class="plan"><b>₹29</b><small>30 days</small></div><div class="plan"><b>₹79</b><small>3 months</small></div></div><p class="small">Proposed prices only; no payment gateway is connected.</p><h2>Admin security</h2>'+empty('Approval required','Admins approve every story, episode, and direct ad from the backend.')},
settings:function(){return '<div class="eyebrow">PREFERENCES</div><h1>App settings.</h1><div class="item"><b>Data saver</b><label><input class="toggle" type="checkbox" id="data" '+(get('data')==='true'?'checked':'')+'> Save data preference</label></div><div class="item"><b>Reduce motion</b><label><input class="toggle" type="checkbox" id="motion" '+(get('motion')==='true'?'checked':'')+'> Reduced UI animation</label></div><h2>Backend connection</h2><div class="notice">The app's Home, Search, Saved, Profile and Settings work offline. Streaming, actual sign-in, secure approvals, and billing require a hosted backend. No fake content or checkout is included.</div><form id="connect"><label for="url">HTTPS backend URL</label><input id="url" class="input" type="url" inputmode="url" placeholder="https://yourdomain.com" value="'+escape(get('server'))+'"><div class="row"><button class="btn" type="submit">Save & open ↗</button><button type="button" class="btn alt" id="clear">Clear</button></div><p id="error" style="color:#f99"></p></form><h2>About</h2><p class="small">FEARLESS STORIES V4 · Capacitor Android</p>'}
};
function show(p){if(!pages[p])p='home';current=p;content.innerHTML=pages[p]();document.querySelectorAll('[data-tab]').forEach(btn=>btn.classList.toggle('selected',btn.dataset.tab===p));window.scrollTo(0,0);document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));document.querySelectorAll('[data-genre]').forEach(b=>b.onclick=()=>{genre=b.dataset.genre;show('discover')});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{genre=b.dataset.filter;show('discover')});const s=document.getElementById('search');if(s)s.oninput=()=>{query=s.value;document.getElementById('result').textContent='0 results'+(query?' for '+query:'')};const d=document.getElementById('data');if(d)d.onchange=()=>put('data',d.checked);const m=document.getElementById('motion');if(m)m.onchange=()=>put('motion',m.checked);const c=document.getElementById('clear');if(c)c.onclick=()=>{put('server','');document.getElementById('url').value=''};const f=document.getElementById('connect');if(f)f.onsubmit=e=>{e.preventDefault();const url=document.getElementById('url').value.trim();let safe=false;try{const u=new URL(url);safe=!u.username&&!u.password&&!u.search&&!u.hash&&(u.protocol==='https:'||(u.protocol==='http:'&&/^(localhost|127\.0\.0\.1|10\.|192\.168\.)/.test(u.hostname)))}catch{}if(!safe){document.getElementById('error').textContent='Use HTTPS or private development LAN';return}put('server',url);window.location.assign(url)}}document.getElementById('settings').onclick=()=>show(current==='settings'?'home':'settings');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));show('home')})();
</script></body></html>
